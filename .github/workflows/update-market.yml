name: Update completed daily quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-market.yml
      - scripts/update_market.py
  schedule:
    # JST 16:20–23:50, every 30 minutes. GitHub may delay/drop scheduled runs.
    - cron: '20,50 7-14 * * 1-5'
permissions:
  contents: write
  pages: write
concurrency:
  group: daily-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether both stocks are already current
        id: preflight
        if: github.event_name == 'schedule'
        run: |
          current=$(python3 scripts/update_market.py --check-current | tail -n 1) || current=false
          if [ "$current" = 'current=true' ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo 'Both stocks are current; skipping setup, fetch, tests and publishing.'
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.current != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.current != 'true'
        with:
          node-version: '24'
      - name: Fetch complete daily bars
        if: steps.preflight.outputs.current != 'true'
        id: fetch
        continue-on-error: true
        run: python scripts/update_market.py
      - name: Verify history and strategy
        if: steps.preflight.outputs.current != 'true'
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          npm test
      - name: Save quotes and request Pages rebuild
        if: steps.preflight.outputs.current != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/market.json data/market-4062.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/market-4062.json
          git commit -m "Update completed KIOXIA and IBIDEN daily quotes"
          git push
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report incomplete stock updates
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more stocks could not update. Valid updates were published independently. See fetch logs."
          exit 1
