<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓位管理 · Position Manager</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<div class="container">

<header>
  <h1>仓位<span class="accent">管理</span></h1>
  <div class="subtitle">Position Manager · Six Apples Rule</div>
</header>

<!-- 基础配置 -->
<div class="panel panel-compact">
  <div class="config-grid">
    <div class="field">
      <label>信用保証金 <span class="unit">JPY</span></label>
      <input type="text" id="margin" placeholder="19000000" inputmode="numeric">
    </div>
    <div class="field">
      <label>レバレッジ倍率</label>
      <input type="number" id="leverage" value="2.5" step="0.1" min="1">
    </div>
  </div>

  <div class="config-metrics">
    <div class="metric metric-inline">
      <span class="metric-label">満仓目標 (6 苹果)</span>
      <span class="metric-value accent big num" id="fullPosition">—</span>
    </div>
    <div class="metric metric-inline">
      <span class="metric-label"><span class="apple-icon"></span> 1 苹果</span>
      <span class="metric-value accent num" id="apple-value">—</span>
    </div>
  </div>
</div>

<!-- 止盈止损规则 -->
<div class="panel" style="margin-top: 20px;">
  <div class="field">
    <label>持仓成本(平均价)</label>
    <input type="number" id="cost" placeholder="2500" step="0.1">
  </div>

  <div class="rule-grid">
    <div class="rule-box profit">
      <h3>止盈 · 卖中位仓</h3>
      <div class="rule-line">
        <span class="trigger">+5% <span class="rule-price" id="tp5-price">(—)</span></span>
        <span class="action">减 1 苹果 <span class="rule-value" id="tp5-value">(—)</span></span>
      </div>
      <div class="rule-line">
        <span class="trigger">+8% <span class="rule-price" id="tp8-price">(—)</span></span>
        <span class="action">减 2 苹果 <span class="rule-value" id="tp8-value">(—)</span></span>
      </div>
      <div class="rule-line">
        <span class="trigger">+12% <span class="rule-price" id="tp12-price">(—)</span></span>
        <span class="action">减 3 苹果 <span class="rule-value" id="tp12-value">(—)</span></span>
      </div>
    </div>

    <div class="rule-box loss">
      <h3>止损 · 卖高位仓</h3>
      <div class="rule-line">
        <span class="trigger">-8% <span class="rule-price" id="sl8-price">(—)</span></span>
        <span class="action">减 3 苹果 <span class="rule-value" id="sl8-value">(—)</span></span>
      </div>
      <div class="rule-line">
        <span class="trigger">-12% <span class="rule-price" id="sl12-price">(—)</span></span>
        <span class="action">清仓 <span class="rule-value" id="sl12-value">(—)</span></span>
      </div>
    </div>
  </div>
</div>

<!-- 补仓阶梯 -->
<div class="panel" style="margin-top: 20px;">
  <div class="field" style="margin-top: 8px;">
    <label>本次止盈卖出价</label>
    <input type="number" id="sellPrice" placeholder="2625" step="0.1">
  </div>

  <div class="ladder" id="ladder">
    <div class="ladder-step">
      <div class="pct">回撤 0.5% — 2%</div>
      <div class="price">—</div>
      <div class="action">加 1 苹果 <span class="ladder-value" id="lad1-value">(—)</span></div>
    </div>
    <div class="ladder-step">
      <div class="pct">回撤 2% — 4%</div>
      <div class="price">—</div>
      <div class="action">加 2 苹果 <span class="ladder-value" id="lad2-value">(—)</span></div>
    </div>
    <div class="ladder-step">
      <div class="pct">回撤 4%+ / EMA75</div>
      <div class="price">—</div>
      <div class="action">ALL IN (6 苹果) <span class="ladder-value" id="lad3-value">(—)</span></div>
    </div>
  </div>
</div>

<div style="text-align: center; color: var(--text-faint); font-size: 12px; letter-spacing: 0.2em; margin-top: 30px; padding-bottom: 20px;">
  数据已保存在本地浏览器
</div>

</div>

<script src="script.js?v=10"></script>
</body>
</html>
